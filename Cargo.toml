[package]
name = "json2leaf"
version = "0.2.0"
edition = "2024"
description = "Map nested JSON and XML documents into relational leaf rows"
repository = "https://github.com/wavey-ai/folio"
keywords = ["json", "postgresql", "schema", "wasm", "xml"]
categories = ["command-line-utilities", "data-structures", "wasm"]

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "json2leaf"
path = "src/bin/json2leaf.rs"
required-features = ["cli"]

[features]
default = ["cli", "xml"]
cli = ["dep:anyhow", "dep:clap", "dep:walkdir"]
xml = ["dep:quick-xml"]
wasm = ["dep:wasm-bindgen", "xml"]

[dependencies]
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

anyhow = { version = "1.0", optional = true }
clap = { version = "4.5", features = ["derive"], optional = true }
quick-xml = { version = "0.38", features = ["serialize"], optional = true }
walkdir = { version = "2.5", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "0.2", optional = true }

[dev-dependencies]
pretty_assertions = "1.4"
